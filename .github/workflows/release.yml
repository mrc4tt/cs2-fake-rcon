name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract plugin version from fakercon.cpp
        id: extract
        run: |
          VERSION=$(awk '/FakeRcon::GetVersion/{f=1} f && /return/{match($0,/"[^"]+"/); print substr($0,RSTART+1,RLENGTH-2); exit}' fakercon.cpp)
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version from fakercon.cpp" >&2
            exit 1
          fi
          echo "Plugin version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (Sniper SDK)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
      options: --user root
    steps:
      - name: Install build prerequisites
        run: |
          set -eux
          if ! command -v git >/dev/null || ! command -v pip3 >/dev/null; then
            # Sniper is Debian 11 (bullseye), which is EOL: point every apt
            # source (incl. bullseye-security) at archive.debian.org.
            find /etc/apt -name '*.list' -o -name '*.sources' | xargs -r sed -i -E \
              -e 's#https?://(deb|security)\.debian\.org/debian-security#http://archive.debian.org/debian-security#g' \
              -e 's#https?://deb\.debian\.org/debian#http://archive.debian.org/debian#g'
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y --no-install-recommends git python3-pip
          fi
          pip3 install --quiet git+https://github.com/alliedmodders/ambuild
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: cs2-fake-rcon

      - name: Clone hl2sdk-cs2
        run: git clone --depth 1 --branch cs2 https://github.com/alliedmodders/hl2sdk hl2sdk-root/hl2sdk-cs2

      - name: Clone metamod-source
        run: git clone --depth 1 --recursive https://github.com/alliedmodders/metamod-source metamod-source

      - name: Clone hl2sdk-manifests
        run: git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests hl2sdk-manifests

      - name: Configure
        working-directory: cs2-fake-rcon
        env:
          CC: clang
          CXX: clang++
          HL2SDKCS2: ${{ github.workspace }}/hl2sdk-root/hl2sdk-cs2
          MMSOURCE112: ${{ github.workspace }}/metamod-source
        run: |
          set -eux
          mkdir -p build
          cd build
          python3 ../configure.py \
            -s cs2 \
            --targets=x86_64 \
            --plugin-name=fake_rcon \
            --plugin-alias=fake_rcon \
            --enable-optimize \
            --hl2sdk-root="${GITHUB_WORKSPACE}/hl2sdk-root" \
            --mms_path="${GITHUB_WORKSPACE}/metamod-source" \
            --hl2sdk-manifests="${GITHUB_WORKSPACE}/hl2sdk-manifests"

      - name: Build
        working-directory: cs2-fake-rcon/build
        run: ambuild

      - name: Stage addons/
        run: |
          set -eux
          rm -rf dist
          mkdir -p dist
          cp -r cs2-fake-rcon/build/package/addons dist/addons

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows (MSVC)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: cs2-fake-rcon

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install ambuild
        run: pip install --quiet git+https://github.com/alliedmodders/ambuild

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone hl2sdk-cs2
        run: git clone --depth 1 --branch cs2 https://github.com/alliedmodders/hl2sdk hl2sdk-root/hl2sdk-cs2

      - name: Clone metamod-source
        run: |
          git clone --depth 1 https://github.com/alliedmodders/metamod-source metamod-source
          git -C metamod-source submodule update --init --recursive

      - name: Clone hl2sdk-manifests
        run: git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests hl2sdk-manifests

      - name: Configure
        working-directory: cs2-fake-rcon
        shell: cmd
        env:
          HL2SDKCS2: ${{ github.workspace }}\hl2sdk-root\hl2sdk-cs2
          MMSOURCE112: ${{ github.workspace }}\metamod-source
        run: |
          if not exist build mkdir build
          cd build
          python ..\configure.py -s cs2 --targets=x86_64 --plugin-name=fake_rcon --plugin-alias=fake_rcon --enable-optimize --hl2sdk-root="%GITHUB_WORKSPACE%\hl2sdk-root" --mms_path="%GITHUB_WORKSPACE%\metamod-source" --hl2sdk-manifests="%GITHUB_WORKSPACE%\hl2sdk-manifests"

      - name: Build
        working-directory: cs2-fake-rcon/build
        shell: cmd
        run: ambuild

      - name: Stage addons/
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse cs2-fake-rcon/build/package/addons dist/addons

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, linux, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build release archives
        if: steps.check.outputs.exists == 'false'
        run: |
          set -eux
          test -d artifacts/linux/addons
          test -d artifacts/windows/addons
          tar -C artifacts/linux   -czf linux.tar.gz addons
          (cd artifacts/windows && zip -rq "$GITHUB_WORKSPACE/windows.zip" addons)

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            linux.tar.gz
            windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
